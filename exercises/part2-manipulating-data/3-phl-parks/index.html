<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philadelphia Parks Acreage</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link rel="stylesheet" href="../../../common-components/style.css">
    <link rel="stylesheet" href="css/styles.css">

    <script type="importmap">
        {
            "imports": {
                "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Philadelphia Parks Acreage</h1>
        <p class="info">Explore Philadelphia Parks & Recreation properties and calculate acreage</p>
    </header>
    <main>
        <div class="sidebar-layout">
            <aside class="sidebar">
                <section id="acreage-card" class="card">
                    <h2>Philadelphia Parks Acreage</h2>
                    <p class="card-prompt">The total acreage of Philadelphia Parks &amp; Recreation properties is:</p>
                    <div class="acreage-value-container">
                        <span id="total-acreage" class="acreage-value">0.00</span>
                    </div>
                </section>

                <form id="park-sites-controls" class="controls">
                    <div class="form-group">
                        <label for="park-sites-filter">Filter Sites:</label>
                        <input type="text" id="park-sites-filter" name="park-sites-filter" placeholder="Type to filter sites..." autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="park-sites-select">Select Park Sites:</label>
                        <select id="park-sites-select" name="park-sites-select" multiple size="10">
                            <!-- Populated dynamically with optgroups -->
                        </select>
                    </div>

                    <button type="reset" id="reset-selection-btn" name="reset-selection-btn">Reset Selection</button>
                </form>
            </aside>

            <section class="map-section">
                <div id="map" class="map visualization-container"></div>
            </section>
        </div>
    </main>
    <footer>
        <p>Data from <a href="https://opendataphilly.org/datasets/ppr-properties/" target="_blank" rel="noopener">OpenDataPhilly</a>.</p>
    </footer>
</body>
</html>
